<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คู่มือเลือกสถานดูแลผู้สูงอายุ</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            font-family: sans-serif;
        }
        .book-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        img {
            width: 100%;
            height: auto;
            display: block;
            box-shadow: 0 5px 25px rgba(0,0,0,0.7);
            border-radius: 4px;
        }
        .header-title {
            color: #fff;
            margin-bottom: 20px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 class="header-title">คู่มือเลือกสถานดูแลผู้สูงอายุ</h1>

    <div class="book-container">
        <img src="1.png" alt="หน้า 1">
        <img src="2.png" alt="หน้า 2">
        <img src="3.png" alt="หน้า 3">
        <img src="4.png" alt="หน้า 4">
        <img src="5.png" alt="หน้า 5">
    </div>

</body>
</html>

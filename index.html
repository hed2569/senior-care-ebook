<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>8 คำถามสำคัญ ก่อนเลือกสถานดูแลผู้สูงอายุ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#f5f5f5;
    font-family:sans-serif;
}

.slider{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    width:100vw;
    height:100vh;
}

.slider::-webkit-scrollbar{
    display:none;
}

.slide{
    min-width:100vw;
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    justify-content:center;
    align-items:center;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.page-number{
    position:fixed;
    top:15px;
    right:15px;
    background:rgba(0,0,0,.7);
    color:white;
    padding:8px 14px;
    border-radius:20px;
    z-index:999;
}

.dots{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:999;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#ccc;
}

.dot.active{
    background:#0d6efd;
}
</style>

</head>
<body>

<div class="page-number">
    <span id="current">1</span>/5
</div>

<div class="slider" id="slider">

    <div class="slide">
        <mages/1.png
    </div>

    <div class="slide">
        images/2.png
    </div>

    <div class="slide">
        <img src="ng
    </div>

    <div class="slide">
        <img src="images/4.png"

    <div class="slide">
        <img src="images/5.png" 
</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<script>
const slider = document.getElementById('slider');
const dots = document.querySelectorAll('.dot');
const current = document.getElementById('current');

slider.addEventListener('scroll', () => {

    const index = Math.round(
        slider.scrollLeft / window.innerWidth
    );

    current.textContent = index + 1;

    dots.forEach(dot => dot.classList.remove('active'));

    if(dots[index]){
        dots[index].classList.add('active');
    }
});
</script>

</body>
</html>

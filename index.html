<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คู่มือเลือกสถานดูแลผู้สูงอายุ</title>
    
    <!-- ตั้งค่าสำหรับแชร์ลิงก์ใน Line / Facebook (แสดงชื่อและภาพปกหน้า 1) -->
    <meta property="og:title" content="คู่มือเลือกสถานดูแลผู้สูงอายุ">
    <meta property="og:description" content="ปัดซ้าย-ขวาเพื่อเปลี่ยนหน้าอ่านคู่มือ ➔">
    <meta property="og:image" content="https://hed2569.github.io/senior-care-ebook/1.png">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            overflow: hidden;
            font-family: sans-serif;
        }
        .book-container {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .page {
            flex: 0 0 100%;
            width: 100%;
            height: 100vh;
            scroll-snap-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #1a1a1a;
        }
        .page img {
            max-width: 95%;
            max-height: 92vh;
            object-fit: contain;
            box-shadow: -10px 0 25px rgba(0,0,0,0.5), 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 4px;
        }
        /* แถบควบคุมด้านล่าง (มีเฉพาะปุ่มเปลี่ยนหน้าและตัวเลขบอกหน้า) */
        .nav-bar {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .nav-btn {
            background: #ffffff22;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        .nav-btn:hover {
            background: #ffffff44;
        }
        #page-indicator {
            font-size: 14px;
            letter-spacing: 1px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- ส่วนแสดงภาพแนวนอน -->
    <div class="book-container" id="book">
        <div class="page"><img src="1.png" alt="หน้า 1"></div>
        <div class="page"><img src="2.png" alt="หน้า 2"></div>
        <div class="page"><img src="3.png" alt="หน้า 3"></div>
        <div class="page"><img src="4.png" alt="หน้า 4"></div>
        <div class="page"><img src="5.png" alt="หน้า 5"></div>
    </div>

    <!-- แถบควบคุมด้านล่าง -->
    <div class="nav-bar">
        <button class="nav-btn" onclick="prevPage()">◀ ย้อนกลับ</button>
        <span id="page-indicator">หน้า 1 / 5</span>
        <button class="nav-btn" onclick="nextPage()">ถัดไป ▶</button>
    </div>

    <script>
        const book = document.getElementById('book');
        const indicator = document.getElementById('page-indicator');
        const totalPages = 5;

        function getCurrentPage() {
            return Math.round(book.scrollLeft / book.clientWidth) + 1;
        }

        function updateIndicator() {
            const pageNum = getCurrentPage();
            indicator.innerText = `หน้า ${pageNum} / ${totalPages}`;
        }

        function nextPage() {
            let currentPage = getCurrentPage();
            if (currentPage < totalPages) {
                book.scrollBy({ left: book.clientWidth, behavior: 'smooth' });
            }
        }

        function prevPage() {
            let currentPage = getCurrentPage();
            if (currentPage > 1) {
                book.scrollBy({ left: -book.clientWidth, behavior: 'smooth' });
            }
        }

        book.addEventListener('scroll', () => {
            updateIndicator();
        });
    </script>
</body>
</html>

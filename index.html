# senior-care-ebook
คู่มือเลือกสถานดูแลผู้สูงอายุ
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>8 คำถามสำคัญ ก่อนเลือกสถานดูแลผู้สูงอายุ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f5f5;
    overflow:hidden;
    font-family:sans-serif;
}

.slider{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    width:100vw;
    height:100vh;
    scroll-behavior:smooth;
}

.slider::-webkit-scrollbar{
    display:none;
}

.slide{
    min-width:100vw;
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* เลขหน้า */

.page-number{
    position:fixed;
    top:15px;
    right:15px;
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:8px 14px;
    border-radius:20px;
    font-size:14px;
    z-index:100;
}

/* จุดด้านล่าง */

.dots{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:100;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#d0d0d0;
    transition:0.3s;
}

.dot.active{
    background:#0d6efd;
    transform:scale(1.2);
}
</style>
</head>

<body>

<div class="page-number">
    <span id="current">1</span>/5
</div>

<div class="slider" id="slider">

    <div class="slide">
        images/1.jpg
    </div>

    <div class="slide">
        images/2.jpg
    </div>

    <div class="slide">
        images/3.jpg
    </div>

    <div class="slide">
        images/4.jpg
    </div>

    <div class="slide">
        images/5.jpg
    </div>

</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<script>
const slider = document.getElementById('slider');
const dots = document.querySelectorAll('.dot');
const current = document.getElementById('current');

slider.addEventListener('scroll', () => {

    const index = Math.round(
        slider.scrollLeft / window.innerWidth
    );

    current.textContent = index + 1;

    dots.forEach(dot => {
        dot.classList.remove('active');
    });

    if(dots[index]){
        dots[index].classList.add('active');
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>8 คำถามสำคัญ ก่อนเลือกสถานดูแลผู้สูงอายุ</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f4f6f8;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

.slider{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    width:100vw;
    height:100vh;
}

.slider::-webkit-scrollbar{
    display:none;
}

.slide{
    min-width:100vw;
    height:100vh;
    scroll-snap-align:start;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f6f8;
}

.slide img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
}

/* เลขหน้า */

.page-number{
    position:fixed;
    top:15px;
    right:15px;
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:8px 16px;
    border-radius:30px;
    font-size:14px;
    font-weight:bold;
    z-index:100;
}

/* จุดบอกหน้า */

.dots{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:10px;
    z-index:100;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#cccccc;
    transition:all 0.3s ease;
}

.dot.active{
    background:#0d6efd;
    transform:scale(1.3);
}

</style>
</head>

<body>

<div class="page-number">
    <span id="current">1</span>/5
</div>

<div class="slider" id="slider">

    <div class="slide">
        images/1.png
    </div>

    <div class="slide">
        <img src="images </div>

    <div class="slide">
        <img src="images/3.png" alt  <div class="slide">
        <img s/4.png
    </div>

    <div class="slide">
        images/5.png
    </div>

</div>

<div class="dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<script>

const slider = document.getElementById('slider');
const dots = document.querySelectorAll('.dot');
const current = document.getElementById('current');

slider.addEventListener('scroll', () => {

    const index = Math.round(
        slider.scrollLeft / window.innerWidth
    );

    current.textContent = index + 1;

    dots.forEach(dot => {
        dot.classList.remove('active');
    });

    if(dots[index]){
        dots[index].classList.add('active');
    }

});

</script>

</body>
</html>
